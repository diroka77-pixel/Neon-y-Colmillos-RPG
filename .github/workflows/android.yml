name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.3-stable
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Godot 4.3 and templates outside project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          cd "$RUNNER_TEMP/godot"
          curl -fsSL --retry 3 -o engine.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q engine.zip
          unzip -q templates.tpz 'templates/android*' 'templates/version.txt'
          mv templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import, deterministic generation, input and scene tests
        run: bash ci/check.sh Godot_v4.3-stable_linux.x86_64
      - name: Capture visual preview
        run: |
          command -v xvfb-run || { sudo apt-get update -qq; sudo apt-get install -y xvfb; }
          xvfb-run -a Godot_v4.3-stable_linux.x86_64 --path . --script res://tests/capture.gd -- res://build/preview.png 2>&1 | tee build/visual.log
          ! grep -E 'SCRIPT ERROR|ERROR:' build/visual.log
      - name: Configure Android SDK and persistent public test signing key
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          base64 --decode ci/debug.keystore.b64 > "$RUNNER_TEMP/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          python3 ci/configure_android.py
      - name: Export ARM64 APK
        run: |
          set -euo pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug Android build/NeonYColmillos-v0.2.0.apk 2>&1 | tee build/export.log
          ! grep -E 'SCRIPT ERROR|ERROR:' build/export.log
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/NeonYColmillos-v0.2.0.apk > build/signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging build/NeonYColmillos-v0.2.0.apk > build/package.txt
          grep "versionName='0.2.0'" build/package.txt
          grep "native-code: 'arm64-v8a'" build/package.txt
          sha256sum build/NeonYColmillos-v0.2.0.apk > build/SHA256SUMS.txt
      - name: Export x86_64 APK for Android emulator only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('export_presets.cfg')
          text = path.read_text().replace('architectures/arm64-v8a=true', 'architectures/arm64-v8a=false').replace('architectures/x86_64=false', 'architectures/x86_64=true')
          path.write_text(text)
          PY
          Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug Android build/emulator.apk
      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and relaunch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/android_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NeonYColmillos-v0.2.0-APK
          path: build/NeonYColmillos-v0.2.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonYColmillos-v0.2.0-QA
          path: |
            build/*.log
            build/*.txt
            build/*.png
          if-no-files-found: warn
